name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install WebUI dependencies
        run: npm ci
        working-directory: webui

      - name: Install PlatformIO
        run: pip install platformio

      - name: Check tag matches version.txt
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(cat version.txt)"

      - name: Build firmware
        run: pio run -e hb-rf-eth

      - name: Host unit tests
        run: test/host/run.sh

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/hb-rf-eth/firmware.bin
            .pio/build/hb-rf-eth/*.bin

      # The firmware's online update reads the latest release of the configured
      # repository and installs its firmware_*.bin
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/hb-rf-eth/firmware_*.bin
          generate_release_notes: true
